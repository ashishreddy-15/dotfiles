# Laptop memory (zram) and idle-power tuning. Installed to /etc/sysctl.d/ by `./install.sh services`.

# Disable periodic PMU NMI interrupts on every CPU core (tuned's balanced-battery leaves this on).
kernel.nmi_watchdog = 0

# zram is RAM-backed, not a spinning disk: no 8-page swap-in readahead, no watermark boost spikes.
# (Leave vm.watermark_scale_factor at kernel default 10; raising it inflates totalreserve_pages and reduces MemAvailable.)
vm.page-cluster = 0
vm.watermark_boost_factor = 0

# Batch background dirty-page writeback every 15 s instead of 5 s to reduce idle NVMe wakeups.
vm.dirty_writeback_centisecs = 1500
