<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~/start</title>
  <style>
    @font-face { font-family: "Maple Mono"; font-weight: 400; src: url("fonts/MapleMono-NF-Regular.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: "Maple Mono"; font-weight: 500; src: url("fonts/MapleMono-NF-Medium.ttf") format("truetype"); font-display: swap; }
    :root {
      --bg: #fafaf9;
      --text: #292524;
      --muted: #a8a29e;
      --accent: #2563eb;
      --border: #e7e5e4;
      --online: #16a34a;
      --font: "Maple Mono", "Maple Mono NF", "Maple Mono NL", ui-monospace, SFMono-Regular, Menlo, monospace;
      --spring: linear(0, 0.452 12%, 0.805 24%, 0.985 36%, 1.032 48%, 1.015 64%, 1);
      --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131316;
        --text: #d6d3d1;
        --muted: #6b6b73;
        --accent: #8ab4f8;
        --border: #25252b;
        --online: #4ade80;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 820px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2.5rem;
    }

    h1 { font-size: 0.95rem; font-weight: 500; color: var(--muted); }
    #meta { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 0.7rem;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.14s var(--ease-out);
    }
    .search-wrap:focus-within { border-color: var(--accent); }

    .prompt { color: var(--accent); user-select: none; }

    #search {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }
    #search::placeholder { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2.5rem;
    }

    .category h2 {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    ul { list-style: none; }
    li + li { margin-top: 0.15rem; }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
      text-decoration: none;
      padding: 0.3rem 0.5rem;
      margin: 0 -0.5rem;
      border-radius: 5px;
      transition: color 0.1s var(--ease-out), background 0.1s var(--ease-out), transform 0.28s var(--spring);
    }

    a:hover, a:focus {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 9%, transparent);
      transform: translateX(2px);
      outline: none;
    }
    a:active {
      transform: translateX(2px) scale(0.98);
    }

    /* Reduce motion (the desktop's switch sets it through gsettings): no nudge or press spring, only the colour fade. */
    @media (prefers-reduced-motion: reduce) {
      a { transition: color 0.1s var(--ease-out), background 0.1s var(--ease-out); }
      a:hover, a:focus, a:active { transform: none; }
    }

    .link-left { display: flex; align-items: center; gap: 0.5rem; }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
    }
    .dot.up { background: var(--online); opacity: 1; }

    kbd {
      font-family: inherit;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.7;
    }
    a:hover kbd, a:focus kbd { color: var(--accent); opacity: 1; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>~/start</h1>
      <div id="meta"></div>
    </header>

    <form class="search-wrap" id="search-form">
      <span class="prompt">&gt;</span>
      <input type="text" id="search" placeholder="press / to search (e.g. gh, aw, yt)..." autocomplete="off" spellcheck="false">
    </form>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    let config = {};
    const keyMap = new Map();

    function updateClock() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('meta').textContent = `${date} · ${time}`;
    }

    async function checkPort(url, dotEl) {
      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 800);
        await fetch(url, { mode: 'no-cors', signal: controller.signal });
        dotEl.classList.add('up');
      } catch (_) {}
    }

    async function init() {
      updateClock();
      setInterval(updateClock, 1000);

      const res = await fetch('./links.json');
      config = await res.json();

      const grid = document.getElementById('grid');
      config.categories.forEach((cat, colIdx) => {
        const section = document.createElement('section');
        section.className = 'category';

        const h2 = document.createElement('h2');
        h2.textContent = cat.title;
        section.appendChild(h2);

        const ul = document.createElement('ul');
        cat.links.forEach((link, rowIdx) => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = link.url;
          a.dataset.col = colIdx;
          a.dataset.row = rowIdx;

          const left = document.createElement('span');
          left.className = 'link-left';

          if (link.ping) {
            const dot = document.createElement('span');
            dot.className = 'dot';
            left.appendChild(dot);
            checkPort(link.url, dot);
          }

          const label = document.createElement('span');
          label.textContent = link.name;
          left.appendChild(label);
          a.appendChild(left);

          if (link.key) {
            const kbd = document.createElement('kbd');
            kbd.textContent = link.key;
            a.appendChild(kbd);
            keyMap.set(link.key.toLowerCase(), link.url);
          }

          li.appendChild(a);
          ul.appendChild(li);
        });

        section.appendChild(ul);
        grid.appendChild(section);
      });
    }

    const searchInput = document.getElementById('search');
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = searchInput.value.trim();
      if (!raw) return;

      const [prefix, ...rest] = raw.split(' ');
      const query = rest.join(' ');
      if (config.search?.bangs?.[prefix] && query) {
        window.location.href = config.search.bangs[prefix] + encodeURIComponent(query);
      } else {
        window.location.href = (config.search?.default || 'https://duckduckgo.com/?q=') + encodeURIComponent(raw);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (document.activeElement === searchInput) {
        if (e.key === 'Escape') {
          searchInput.blur();
          searchInput.value = '';
        }
        return;
      }

      if (e.key === '/') {
        e.preventDefault();
        searchInput.focus();
        return;
      }

      const targetUrl = keyMap.get(e.key.toLowerCase());
      if (targetUrl) {
        e.preventDefault();
        window.location.href = targetUrl;
        return;
      }

      // Vim spatial navigation across links
      const navKeys = ['h', 'j', 'k', 'l', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'];
      if (navKeys.includes(e.key)) {
        e.preventDefault();
        const active = document.activeElement;
        let col = active?.dataset?.col ? parseInt(active.dataset.col, 10) : 0;
        let row = active?.dataset?.row ? parseInt(active.dataset.row, 10) : -1;

        if (e.key === 'j' || e.key === 'ArrowDown') row++;
        if (e.key === 'k' || e.key === 'ArrowUp') row = Math.max(0, row - 1);
        if (e.key === 'l' || e.key === 'ArrowRight') col++;
        if (e.key === 'h' || e.key === 'ArrowLeft') col = Math.max(0, col - 1);

        const next = document.querySelector(`a[data-col="${col}"][data-row="${row}"]`)
                  || document.querySelector(`a[data-col="${col}"][data-row="0"]`)
                  || document.querySelector('a[data-col="0"][data-row="0"]');
        if (next) next.focus();
      }
    });

    init();
  </script>
</body>
</html>
