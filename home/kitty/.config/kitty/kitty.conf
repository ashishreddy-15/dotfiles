# kitty terminal. Reload after editing: Ctrl+Shift+F5.

font_family      family="Maple Mono NF"
font_size        11.0

window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# Colours: "Abyss & Ice" (same palette as quickshell/Theme.qml)
foreground            #c0c6cc
background            #0f1114
selection_foreground  none
selection_background  #2a3037
cursor                #a3b9c4
cursor_text_color     #0f1114
url_color             #a3b9c4
active_border_color   #a3b9c4
inactive_border_color #2a3037

# black
