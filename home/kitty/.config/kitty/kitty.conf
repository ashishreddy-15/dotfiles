# kitty terminal. Reload after editing: Ctrl+Shift+F5.

font_family      family="Maple Mono NF"
font_size        11.5

window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# Colours: "Carbon & Pewter" (same palette as quickshell/Theme.qml)
foreground            #adb0b3
background            #111111
selection_foreground  none
selection_background  #262626
cursor                #6c7f91
cursor_text_color     #111111
url_color             #6c7f91
active_border_color   #6c7f91
inactive_border_color #262626

# black
color0  #1b1b1b
color8  #666a6e
# red
color1  #a67a7e
color9  #b88f93
# green
color2  #7d9889
color10 #93ab9e
