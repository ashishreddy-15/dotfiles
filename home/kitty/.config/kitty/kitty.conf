# kitty terminal. Reload after editing: Ctrl+Shift+F5.

font_family      family="Maple Mono NF"
font_size        10.5

window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# Colours live in the *-theme.auto.conf files next to this one: kitty reads dark-theme.auto.conf or
# light-theme.auto.conf according to the OS colour scheme (gsettings color-scheme) and switches live when it changes.
# no-preference-theme.auto.conf (GNOME's "default") uses the dark one.
