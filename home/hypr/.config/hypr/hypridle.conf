# Idle behaviour. Docs: /usr/share/doc/hypridle/example.conf
# Timeline: 2.5 min dim -> 5 min lock -> 5.5 min screens off -> 30 min suspend.
# Apps playing video/audio (browser, mpv) inhibit this automatically.

general {
    lock_cmd         = pidof hyprlock || hyprlock                       # one instance only
    before_sleep_cmd = loginctl lock-session                            # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # screens on after resume
}

# Dim every screen (the laptop and, over DDC, the external monitor) through the shell, which remembers each level
# and puts it back; if the shell is not running, dim the laptop only.
listener {
    timeout    = 150
    on-timeout = qs ipc call brightness dim || brightnessctl -s set 10%
    on-resume  = qs ipc call brightness undim || brightnessctl -r
}

listener {
    timeout    = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
