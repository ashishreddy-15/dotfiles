# Lock screen (fallback until the Quickshell lock exists). Docs: /usr/share/doc/hyprlock/example.conf
# Clear typed password: Esc / Ctrl+U.

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
}

input-field {
    monitor          =
    size             = 300, 50
    outline_thickness = 2
    inner_color      = rgba(141414cc)
    outer_color      = rgba(6c7f91ee)
    check_color      = rgba(7d9889ee)
    fail_color       = rgba(a67a7eee)
    font_color       = rgb(adb0b3)
    fade_on_empty    = false
    rounding         = 8
    font_family      = Maple Mono NF
    placeholder_text = Password
    fail_text        = $PAMFAIL
    position         = 0, -40
    halign           = center
    valign           = center
}

label {
    monitor     =
    text        = $TIME
    font_size   = 80
    font_family = Maple Mono NF
    color       = rgb(adb0b3)
    position    = 0, 80
    halign      = center
    valign      = center
}
