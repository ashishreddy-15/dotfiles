# Lock screen (fallback until the Quickshell lock exists). Docs: /usr/share/doc/hyprlock/example.conf
# Clear typed password: Esc / Ctrl+U.

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
}

input-field {
    monitor          =
    size             = 300, 50
    outline_thickness = 2
    inner_color      = rgba(15181ccc)
    outer_color      = rgba(a3b9c4ee)
    check_color      = rgba(8aa79aee)
    fail_color       = rgba(b48488ee)
    font_color       = rgb(c0c6cc)
    fade_on_empty    = false
    rounding         = 8
    font_family      = Asap
    placeholder_text = Password
    fail_text        = $PAMFAIL
    position         = 0, -40
    halign           = center
    valign           = center
}

label {
    monitor     =
    text        = $TIME
    font_size   = 80
    font_family = Maple Mono NF
    color       = rgb(c0c6cc)
    position    = 0, 80
    halign      = center
    valign      = center
}
