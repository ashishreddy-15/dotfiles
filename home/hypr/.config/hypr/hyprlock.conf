# Lock screen (fallback until the Quickshell lock exists). Docs: /usr/share/doc/hyprlock/example.conf
# Clear typed password: Esc / Ctrl+U.

general {
    hide_cursor = true
}

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
}

input-field {
    monitor          =
    size             = 300, 50
    outline_thickness = 2
    inner_color      = rgba(1e1e2ecc)
    outer_color      = rgba(89b4faee)
    check_color      = rgba(a6e3a1ee)
    fail_color       = rgba(f38ba8ee)
    font_color       = rgb(cdd6f4)
    fade_on_empty    = false
    rounding         = 8
    placeholder_text = Password
    fail_text        = $PAMFAIL
    position         = 0, -40
    halign           = center
    valign           = center
}

label {
    monitor     =
    text        = $TIME
    font_size   = 80
    color       = rgb(cdd6f4)
    position    = 0, 80
    halign      = center
    valign      = center
}
