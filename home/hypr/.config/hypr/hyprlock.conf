# Lock screen, in the shell's look. Docs: /usr/share/doc/hyprlock/example.conf
# No card: the wallpaper itself, lightly blurred; the date and a large light clock near the top; your name and a frosted
# pill for the password near the bottom. Text has a soft shadow so it reads on light wallpapers too.
# Colours and motion are the ones in quickshell/Theme.qml (scripts/ui-check compares them).
# Clear typed password: Esc / Ctrl+U. (No fingerprint: this laptop has no reader.)

# The wallpaper in use. The shell writes the file below whenever it changes (wallpaper/Wallpaper.qml);
# until it exists, a blurred screenshot is used.
$wallpaper = screenshot
source = ~/.local/state/dotfiles/hyprlock-wallpaper.conf

# Palette "Carbon & Pewter" (Theme.qml)
$text   = rgb(adb0b3)
$dim    = rgb(666a6e)
$bright = rgb(d0d3d6)
$border = rgba(262626ff)
$accent = rgba(6c7f91ff)
$warn   = rgba(a8976fff)
$err    = rgba(a67a7eff)
$glass  = rgba(14141499)    # the pill: Theme.card's #141414, a little more see-through
$hair   = rgba(ffffff1f)    # its outline: Theme.selected (white at 0.12)
$shadow = rgba(00000080)
$font   = Maple Mono NF
$light  = Maple Mono NF Light

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# Motion: Theme.qml's easeOut for fades/colours and a crisp springPop bezier for typed dots; speeds in 100 ms (durBase 140 ms = 1.4, durFast 90 ms = 0.9).
animations {
    enabled   = true
    bezier    = easeOut, 0.215, 0.61, 0.355, 1
    bezier    = springPop, 0.34, 1.32, 0.64, 1
    animation = fadeIn, 1, 1.4, easeOut
    animation = fadeOut, 1, 0.9, easeOut
    animation = inputFieldColors, 1, 1.4, easeOut
    animation = inputFieldDots, 1, 1.4, springPop
}

background {
    monitor     =
    path        = $wallpaper
    blur_passes = 1
    blur_size   = 4
    brightness  = 0.78
}

# ---- top: the date, then the time ----
label {
    monitor       =
    text          = cmd[update:60000] date +"%A %-d %B"
    font_size     = 18
    font_family   = $font
    color         = $text
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $shadow
    position      = 0, -150
    halign        = center
    valign        = top
}

label {
    monitor       =
    text          = $TIME
    font_size     = 112
    font_family   = $light
    color         = $bright
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = $shadow
    position      = 0, -185
    halign        = center
    valign        = top
}

# ---- bottom: who you are, then the password ----
label {
    monitor       =
    text          = $USER
    font_size     = 14
    font_family   = $font
    color         = $text
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = $shadow
    position      = 0, 200
    halign        = center
    valign        = bottom
}

# A frosted pill. Its outline turns pewter while checking, red when wrong, amber with Caps Lock on.
input-field {
    monitor           =
    size              = 300, 44
    outline_thickness = 1
    rounding          = -1          # a pill
    inner_color       = $glass
    outer_color       = $hair
    check_color       = $accent
    fail_color        = $err
    capslock_color    = $warn
    font_color        = $bright
    font_family       = $font
    dots_size         = 0.22
    dots_spacing      = 0.4
    dots_center       = true
    fade_on_empty     = false
    shadow_passes     = 2
    shadow_size       = 8
    shadow_color      = $shadow
    placeholder_text  = <span foreground="##adb0b3">Password</span>
    fail_text         = <span foreground="##a67a7e">$PAMFAIL</span>
    position          = 0, 140
    halign            = center
    valign            = bottom
}
