# Lock screen, in the shell's look. Docs: /usr/share/doc/hyprlock/example.conf
# Your wallpaper, softly blurred and darkened, and one frosted card in the middle: the time, the date, the password.
# Colours, corners and motion are the ones in quickshell/Theme.qml (scripts/ui-check compares them).
# Clear typed password: Esc / Ctrl+U. (No fingerprint: this laptop has no reader.)

# The wallpaper in use. The shell writes the file below whenever it changes (wallpaper/Wallpaper.qml);
# until it exists, a blurred screenshot is used.
$wallpaper = screenshot
source = ~/.local/state/dotfiles/hyprlock-wallpaper.conf

# Palette "Carbon & Pewter" (Theme.qml)
$text   = rgb(adb0b3)
$dim    = rgb(666a6e)
$bright = rgb(d0d3d6)
$border = rgba(262626ff)
$raised = rgba(1b1b1bff)
$card   = rgba(141414cc)    # Theme.card: #141414 at 0.80
$accent = rgba(6c7f91ff)
$warn   = rgba(a8976fff)
$err    = rgba(a67a7eff)
$shadow = rgba(00000073)    # Theme.shadow: black at 0.45
$font   = Maple Mono NF

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# Motion: Theme.qml's ease-out curve; speeds in units of 100 ms (durBase 140 ms = 1.4, durFast 90 ms = 0.9).
animations {
    enabled   = true
    bezier    = easeOut, 0.215, 0.61, 0.355, 1
    animation = fadeIn, 1, 1.4, easeOut
    animation = fadeOut, 1, 0.9, easeOut
    animation = inputFieldColors, 1, 1.4, easeOut
    animation = inputFieldDots, 1, 0.9, easeOut
}

background {
    monitor     =
    path        = $wallpaper
    blur_passes = 2
    blur_size   = 6
    brightness  = 0.6
}

# The card (= ui/Card.qml): 10 px corners, a hairline border, a soft shadow.
shape {
    monitor       =
    size          = 400, 250
    color         = $card
    rounding      = 10          # Theme.radiusCard
    border_size   = 1
    border_color  = $border
    shadow_passes = 2
    shadow_size   = 14
    shadow_color  = $shadow
    position      = 0, 0
    halign        = center
    valign        = center
}

label {
    monitor     =
    text        = $TIME
    font_size   = 52
    font_family = $font
    color       = $bright
    position    = 0, 56
    halign      = center
    valign      = center
}

label {
    monitor     =
    text        = cmd[update:60000] date +"%a %-d %b"
    font_size   = 13
    font_family = $font
    color       = $dim
    position    = 0, 6
    halign      = center
    valign      = center
}

# The password field: a row inside the card (6 px corners = Theme.radiusRow). The outline turns pewter while
# checking, red when wrong, amber with Caps Lock on.
input-field {
    monitor           =
    size              = 320, 40
    outline_thickness = 1
    rounding          = 6
    inner_color       = $raised
    outer_color       = $border
    check_color       = $accent
    fail_color        = $err
    capslock_color    = $warn
    font_color        = $bright
    font_family       = $font
    dots_size         = 0.22
    dots_spacing      = 0.4
    dots_center       = true
    fade_on_empty     = false
    placeholder_text  = <span foreground="##666a6e">Password</span>
    fail_text         = <span foreground="##a67a7e">$PAMFAIL</span>
    position          = 0, -64
    halign            = center
    valign            = center
}
